<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms · Rewst MCP Apps Demo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --c-teal-deep: #082c2c;
        --c-teal: #00bbb4;
        --c-aqua: #a5dfdf;
        --c-teal-dark: #005655;
        --c-seafoam: #78cfcf;
        --c-orange: #f9a100;
        --c-amber: #fdd999;
        --c-gray-light: #e6e6e6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Montserrat, Arial, sans-serif;
        font-weight: 500;
        color: var(--c-teal-deep);
        background: var(--c-gray-light);
        line-height: 1.55;
      }
      h1, h2, button { font-family: Poppins, Arial, sans-serif; }
      .hero {
        background: var(--c-teal-deep);
        color: var(--c-aqua);
        padding: 28px 24px 56px;
      }
      .wrap { max-width: 860px; margin: 0 auto; }
      nav img { height: 36px; display: block; }
      h1 {
        font-size: 48px;
        line-height: 1.1;
        margin: 48px 0 12px;
        color: var(--c-aqua);
      }
      h1 span { color: var(--c-orange); }
      .lede { font-size: 19px; max-width: 640px; color: var(--c-seafoam); margin: 0; }
      .url {
        margin-top: 28px;
        display: flex;
        gap: 8px;
        max-width: 620px;
      }
      .url code {
        flex: 1;
        background: rgba(165, 223, 223, 0.12);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 15px;
        color: var(--c-aqua);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        background: var(--c-orange);
        color: var(--c-teal-deep);
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      main { padding: 40px 24px 64px; max-width: 908px; }
      section {
        background: #fff;
        border-radius: 16px;
        padding: 24px 26px;
        margin-bottom: 16px;
      }
      h2 { font-size: 22px; margin: 0 0 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
      .grid section { margin: 0; }
      .eyebrow {
        font-family: Poppins, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        color: var(--c-teal);
        letter-spacing: 0.04em;
      }
      pre {
        background: var(--c-teal-deep);
        color: var(--c-aqua);
        border-radius: 12px;
        padding: 16px 18px;
        white-space: pre-wrap;
        font-size: 14px;
        margin: 12px 0 0;
      }
      ol { padding-left: 20px; margin: 8px 0 0; }
      details { border-top: 1px solid var(--c-gray-light); padding: 10px 0; }
      details:first-of-type { border-top: 0; }
      summary { cursor: pointer; font-size: 16px; }
      .note { font-size: 13px; color: var(--c-teal-dark); margin: 8px 0 0; }
      li { margin-bottom: 6px; }
      a { color: var(--c-teal-dark); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section>
        <p><a href="/">← Rewst MCP Apps Demo</a></p>
        <h2>Terms</h2>
        <p>Provided as-is, as a demo, with no warranty and no support. It isn't made by or affiliated with Rewst. Rewst's name and logo belong to Rewst.</p>
        <p>Don't send it real client data. It may change or go away at any time.</p>
      </section>
    </main>
  </body>
</html>
